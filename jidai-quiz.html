<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時代あてクイズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&family=Yuji+Mai&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Zen Maru Gothic', sans-serif; background: #f4e9d4; color: #2a1810; min-height: 100vh; }
    .brush { font-family: 'Yuji Mai', 'Mochiy Pop One', serif; }
    rt { font-size: .5em; }
    button { font: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 12px; padding: 10px 16px; background: #1d3557; color: #fdf6e3; }
    button:focus-visible { outline: 3px solid #e9c46a; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .5; }
    main { max-width: 680px; margin: 0 auto; padding: 16px 16px 32px; }

    /* dòng thời gian: các ô theo đúng thứ tự, mở dần khi đoán xong */
    .line { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; position: relative; }
    .line::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: #8a5a2b; opacity: .4; }
    .line span { position: relative; background: #fffdf6; border: 2px solid #8a5a2b; border-radius: 8px; text-align: center; font-size: clamp(.6rem, 2.6vw, .95rem);
      padding: 4px 0; font-weight: 700; color: #b8a58a; }
    .line span.p3 { background: #2a9d8f; color: #fff; border-color: #1f776d; }
    .line span.p2 { background: #57b8a8; color: #fff; border-color: #2a9d8f; }
    .line span.p1 { background: #e9c46a; color: #2a1810; }
    .line span.p0 { background: #c9bfae; color: #fff; }
    .line span.now { border-color: #c1121f; box-shadow: 0 0 0 2px #c1121f; }
    .hud { display: flex; justify-content: space-between; margin: 12px 0 8px; font-weight: 700; }
    .hud b { background: #fffdf6; border-radius: 99px; padding: 2px 12px; }

    .pic { border: 6px solid #5a3e2b; border-radius: 10px; background: #eedfbd; overflow: hidden; box-shadow: 0 6px 0 #c9b28a; }
    .pic svg { display: block; width: 100%; height: auto; }
    .hints { list-style: none; margin-top: 12px; display: grid; gap: 6px; }
    .hints li { background: #fffdf6; border-left: 6px solid #e9c46a; border-radius: 8px; padding: 6px 12px; line-height: 2; font-size: 1.05rem; }
    .hints li b { color: #8a5a2b; margin-right: 6px; }
    .q { text-align: center; margin: 14px 0 8px; font-size: 1.25rem; font-weight: 700; color: #1d3557; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opts button { background: #fffdf6; color: #1d3557; border: 3px solid #1d3557; font-size: 1.3rem; padding: 10px 6px; line-height: 1.6; }
    .opts button:not(:disabled):hover { background: #fff3c4; }
    .opts button.ok { background: #2a9d8f; color: #fff; border-color: #1f776d; opacity: 1; }
    .opts button.ng { background: #c1121f; color: #fff; border-color: #8f0d17; }
    .nokana .opts rt { visibility: hidden; }
    .msg { min-height: 1.6em; text-align: center; margin: 10px 0 0; font-size: 1.15rem; font-weight: 700; line-height: 2; }
    .msg.ok { color: #2a9d8f; } .msg.ng { color: #c1121f; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .row label { cursor: pointer; }
    .hintbtn { background: #e9c46a; color: #2a1810; }
    [hidden] { display: none !important; }
    a.home { color: #1d3557; }

    .over { position: fixed; inset: 0; background: rgba(20, 12, 8, .82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
    .box { background: #fdf6e3; border-radius: 18px; padding: 26px 22px; max-width: 480px; text-align: center; border: 4px solid #1d3557; max-height: 100%; overflow: auto; }
    .box h2 { font-size: 2rem; color: #8a5a2b; }
    .box p { margin: 10px 0; line-height: 1.9; }
    .box ul { text-align: left; margin: 8px 0 8px 1.4em; line-height: 1.9; }
    .box button { margin-top: 8px; font-size: 1.1rem; padding: 12px 26px; }
    .box .line { margin: 12px 0; }
  </style>
</head>
<body>
  <main>
    <div class="line" id="line"></div>
    <div class="hud"><b id="score">0点</b><b id="round">1/9</b></div>
    <div class="pic" id="pic"></div>
    <ul class="hints" id="hints"></ul>
    <div class="q">これは<ruby>何<rt>なに</rt></ruby><ruby>時代<rt>じだい</rt></ruby>？</div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="row">
      <label><input type="checkbox" id="kana" checked> ふりがな</label>
      <a class="home" href="index.html">← ゲーム一覧</a>
      <button class="hintbtn" id="hintbtn">💡 ヒント</button>
      <button id="next" hidden>次へ ▶</button>
    </div>
  </main>

  <div class="over" id="start">
    <div class="box">
      <h2 class="brush"><ruby>時代<rt>じだい</rt></ruby>あてクイズ</h2>
      <p><ruby>絵<rt>え</rt></ruby>を<ruby>見<rt>み</rt></ruby>て、<ruby>日本<rt>にほん</rt></ruby>の<ruby>何<rt>なに</rt></ruby><ruby>時代<rt>じだい</rt></ruby>か<ruby>当<rt>あ</rt></ruby>てよう！</p>
      <ul>
        <li><ruby>絵<rt>え</rt></ruby>だけで<ruby>当<rt>あ</rt></ruby>てたら <b>3<ruby>点<rt>てん</rt></ruby></b></li>
        <li>💡ヒント1つで <b>2<ruby>点<rt>てん</rt></ruby></b>、ヒント2つで <b>1<ruby>点<rt>てん</rt></ruby></b></li>
        <li>まちがえると、つぎのヒントが<ruby>出<rt>で</rt></ruby>るよ。</li>
      </ul>
      <p style="font-size:.9rem">キー：<b>1〜4</b> <ruby>答<rt>こた</rt></ruby>え · <b>H</b> ヒント · <b>Enter</b> <ruby>次<rt>つぎ</rt></ruby>へ</p>
      <button id="go">はじめる！</button>
    </div>
  </div>

  <div class="over" id="end" hidden>
    <div class="box">
      <h2 class="brush" id="endTitle"></h2>
      <p id="stats"></p>
      <div class="line" id="endLine"></div>
      <button id="again">もう一回</button>
    </div>
  </div>

<script>
// phong cách 絵巻物: màu khoáng, nền giấy washi, nét mực run (bộ lọc SVG)
const C = { sumi: '#2b2420', shu: '#b5452f', rokusho: '#4e8a6e', gunjo: '#2f4a7a', odo: '#c99a4b', gold: '#d6ae52', paper: '#eedfbd', hada: '#f1dcc0', kuri: '#7a5a3a', tsuchi: '#b0683c', gofun: '#f6efe0' };
const BG = `<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .22 0" result="grain"/>
    <feTurbulence type="fractalNoise" baseFrequency=".012 .08" numOctaves="2" seed="8" result="f"/>
    <feColorMatrix in="f" type="matrix" values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .22  0 0 0 .35 -.05" result="fiber"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="fiber"/><feMergeNode in="grain"/></feMerge>
  </filter>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
  <filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="5" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter>
</defs><rect width="320" height="200" fill="${C.paper}" filter="url(#paper)"/>`;
// nhóm có viền mực
const INK = `filter="url(#ink)" stroke="${C.sumi}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"`;
// mây vàng すやり霞 (2 tầng)
const kasumi = (x, y, w) => `<g fill="${C.gold}" stroke="${C.sumi}" stroke-width=".8" filter="url(#ink)" opacity=".92"><rect x="${x}" y="${y}" width="${w}" height="14" rx="7"/><rect x="${x + w * .25}" y="${y + 10}" width="${w * .6}" height="12" rx="6"/></g>`;
// tay/chân vẽ bằng nét dày: viền mực bên dưới, màu bên trên
const limb = (d, color, w = 8) => `<path d="${d}" stroke="${C.sumi}" stroke-width="${w + 3}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const r = (k, y) => `<ruby>${k}<rt>${y}</rt></ruby>`;
// nhãn tên đồ vật trên tranh (cho tranh khó đoán): x = giữa nhãn, y = mép trên; kana = furigana nhỏ phía trên
const tag = ([x, y, k, kana]) => {
  const w = Math.max(k.length * 14, (kana || '').length * 8) + 12, h = kana ? 30 : 22;
  return `<g font-family="'Zen Maru Gothic', sans-serif" font-weight="700" text-anchor="middle"><rect x="${x - w / 2}" y="${y}" width="${w}" height="${h}" rx="4" fill="#fbf3dc" stroke="${C.sumi}" stroke-width="1.5" opacity=".95"/>`
    + (kana ? `<text x="${x}" y="${y + 10}" font-size="8" fill="${C.shu}">${kana}</text>` : '')
    + `<text x="${x}" y="${y + h - 6}" font-size="14" fill="${C.sumi}">${k}</text></g>`;
};
// quạt 檜扇 xoè nửa vòng (cho tranh 平安): tâm (cx, cy), giấy từ bán kính r1 đến r2, có dây tua hai đầu
function hiogi(cx, cy, r1, r2) {
  const pt = (a, R) => `${(cx + R * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(cy - R * Math.sin(a * Math.PI / 180)).toFixed(1)}`;
  let out = '';
  for (let a = 160; a > 20; a -= 10) // các nếp quạt sáng/tối xen kẽ
    out += `<path d="M${pt(a, r1)} L${pt(a, r2)} L${pt(a - 10, r2)} L${pt(a - 10, r1)}Z" fill="${a % 20 ? '#e6cf96' : '#f3e4bb'}" stroke="#9c7a48" stroke-width=".8"/>`;
  out += `<path d="M${cx} ${cy} L${pt(160, r1)} A${r1} ${r1} 0 0 1 ${pt(20, r1)}Z" fill="#5e3c22"/>`;
  for (let a = 160; a >= 20; a -= 10) out += `<path d="M${pt(a, 6)} L${pt(a, r1)}" stroke="#d1ad70" stroke-width="2"/>`;
  out += `<g fill="${C.shu}" opacity=".75"><circle cx="${cx - 34}" cy="${cy - 52}" r="5"/><circle cx="${cx - 22}" cy="${cy - 62}" r="4"/><circle cx="${cx + 28}" cy="${cy - 56}" r="5"/><circle cx="${cx + 40}" cy="${cy - 44}" r="3.5"/></g>`;
  out += `<path d="M${cx - 50} ${cy - 34} Q${cx - 20} ${cy - 50} ${cx + 8} ${cy - 40} Q${cx + 30} ${cy - 32} ${cx + 52} ${cy - 40}" stroke="${C.rokusho}" stroke-width="3" fill="none" opacity=".85"/>`;
  out += `<path d="M${pt(160, r2)} A${r2} ${r2} 0 0 1 ${pt(20, r2)}" stroke="${C.sumi}" stroke-width="1.4" fill="none"/>`;
  const [lx, ly] = pt(160, r2).split(' ').map(Number), [rx, ry] = pt(20, r2).split(' ').map(Number);
  out += `<path d="M${lx} ${ly} q-8 20 0 36 q6 12 -2 26 M${lx} ${ly} q-2 22 8 36" stroke="${C.shu}" stroke-width="3" fill="none"/>`
    + `<path d="M${rx} ${ry} q8 20 0 36 q-6 12 2 26 M${rx} ${ry} q2 22 -8 36" stroke="${C.rokusho}" stroke-width="3" fill="none"/>`
    + `<circle cx="${cx}" cy="${cy}" r="5" fill="${C.kuri}"/>`;
  return `<g filter="url(#ink)">${out}</g>`;
}

// Các thời kỳ theo đúng thứ tự; svg = hint 1 (tranh tự vẽ, viewBox 320x200), h2/h3 = hint chữ, y = năm bắt đầu
const ERAS = [
  { k: '縄文', y: 'じょうもん', from: '約1万年以上前〜',
    tags: [[68, 26, '竪穴住居', 'たてあなじゅうきょ'], [174, 160, '土器', 'どき'], [260, 160, '土偶', 'どぐう']],
    h2: `${r('縄', 'なわ')}の${r('模様', 'もよう')}の${r('土器', 'どき')}を${r('作', 'つく')}り、${r('狩', 'か')}りや${r('魚', 'さかな')}とりで${r('暮', 'く')}らした。`,
    h3: `${r('土偶', 'どぐう')}・${r('竪穴住居', 'たてあなじゅうきょ')}・${r('三内丸山遺跡', 'さんないまるやまいせき')}`,
    svg: `${BG}
      <g filter="url(#wash)"><path d="M0 128 Q60 108 120 124 T240 116 T320 122 V200 H0Z" fill="${C.rokusho}" opacity=".45"/><rect y="150" width="320" height="50" fill="${C.kuri}" opacity=".55"/></g>
      ${kasumi(196, 26, 130)}
      <g ${INK}>
        <path d="M10 152 L68 72 L126 152Z" fill="${C.odo}"/><path d="M30 152 L68 98 M48 152 L68 110 M88 152 L68 110 M106 152 L68 98" stroke="#7a5a2a" stroke-width="2" fill="none"/>
        <path d="M68 72 L60 58 M68 72 L76 58" stroke-width="3" fill="none"/><path d="M56 152 v-26 q12 -10 24 0 v26Z" fill="${C.sumi}"/>
        <path d="M150 152 Q140 118 152 100 L196 100 Q208 118 198 152Z" fill="${C.tsuchi}"/>
        <path d="M150 102 q-12 -20 4 -32 q4 14 12 6 q-2 -16 12 -18 q8 12 14 0 q14 8 6 26 q14 0 6 18Z" fill="${C.tsuchi}"/>
        <path d="M152 112 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 M150 126 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 M152 140 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" stroke="#5e2a0c" stroke-width="2" fill="none"/>
        <path d="M240 152 L248 122 Q230 112 236 100 L284 100 Q290 112 272 122 L280 152Z" fill="#a8774a"/>
        <ellipse cx="260" cy="84" rx="26" ry="18" fill="#a8774a"/>
        <ellipse cx="249" cy="85" rx="10" ry="8" fill="#e6c9a0"/><ellipse cx="271" cy="85" rx="10" ry="8" fill="#e6c9a0"/>
        <path d="M241 85 h16 M263 85 h16" stroke-width="2.5" fill="none"/><path d="M248 132 h24 M246 142 h28" stroke="#5e3a1a" stroke-width="2" fill="none"/>
      </g>` },
  { k: '弥生', y: 'やよい', from: '紀元前4世紀ごろ〜',
    tags: [[131, 158, '高床倉庫', 'たかゆかそうこ'], [44, 50, '米', 'こめ']],
    h2: `${r('米', 'こめ')}づくり（${r('稲作', 'いなさく')}）が${r('広', 'ひろ')}まった。`,
    h3: `${r('卑弥呼', 'ひみこ')}・${r('邪馬台国', 'やまたいこく')}`,
    svg: `${BG}
      <g filter="url(#wash)"><rect y="140" width="320" height="60" fill="${C.rokusho}" opacity=".7"/></g>
      <path d="M0 156 h320 M0 172 h320 M0 188 h320" stroke="#2f5e43" stroke-width="6" stroke-dasharray="3 10" filter="url(#ink)"/>
      ${kasumi(200, 22, 130)}
      <g ${INK}>
        <path d="M92 142 V100 M112 142 V100 M150 142 V100 M170 142 V100" stroke="${C.kuri}" stroke-width="6"/>
        <path d="M84 108 h16 M104 108 h16 M142 108 h16 M162 108 h16" stroke-width="5"/>
        <rect x="80" y="70" width="102" height="32" fill="#9a6e44"/><path d="M84 78 h94 M84 88 h94" stroke="#5e4022" stroke-width="1.5" fill="none"/>
        <path d="M66 74 L131 24 L196 74Z" fill="${C.odo}"/><path d="M110 40 L152 40" stroke-width="5"/>
        <path d="M196 142 L176 98 M206 142 L186 98 M192 133 h12 M186 120 h12 M180 107 h12" stroke="${C.kuri}" stroke-width="3"/>
        <path d="M248 142 Q226 114 246 94 L248 82 L274 82 L276 94 Q296 114 274 142Z" fill="#c98a52"/><path d="M242 82 h38" stroke-width="5"/>
        <path d="M26 142 Q30 112 46 96 M40 142 Q44 116 60 104" stroke="#8a6a1a" stroke-width="3" fill="none"/>
        <g fill="${C.gold}" stroke-width="1"><ellipse cx="46" cy="96" rx="4" ry="7"/><ellipse cx="40" cy="104" rx="4" ry="7"/><ellipse cx="60" cy="104" rx="4" ry="7"/><ellipse cx="54" cy="112" rx="4" ry="7"/></g>
      </g>` },
  { k: '古墳', y: 'こふん', from: '3世紀後半〜',
    tags: [[150, 166, '王のお墓（上から）', 'おうのおはか（うえから）'], [272, 36, 'はにわ']],
    h2: `${r('王', 'おう')}や${r('豪族', 'ごうぞく')}の${r('大', 'おお')}きなお${r('墓', 'はか')}がたくさん${r('作', 'つく')}られた。`,
    h3: `はにわ・${r('大仙古墳', 'だいせんこふん')}・${r('大和政権', 'やまとせいけん')}`,
    svg: `${BG}
      <g filter="url(#wash)" fill="${C.gunjo}" opacity=".75"><circle cx="100" cy="100" r="66"/><path d="M100 50 L214 26 L214 174 L100 150Z"/></g>
      <g ${INK}><path d="M128.3 56.3 L200 42 L200 158 L128.3 143.7 A52 52 0 1 1 128.3 56.3Z" fill="${C.rokusho}"/>
        <g fill="#2f5e43" stroke-width="1"><circle cx="80" cy="86" r="6"/><circle cx="110" cy="76" r="5"/><circle cx="96" cy="118" r="7"/><circle cx="130" cy="104" r="5"/><circle cx="168" cy="72" r="6"/><circle cx="176" cy="126" r="6"/><circle cx="150" cy="96" r="5"/><circle cx="66" cy="110" r="5"/></g></g>
      ${kasumi(-14, 10, 110)}
      <g filter="url(#ink)">
        ${limb('M258 136 Q240 126 240 108', '#c47a45')}${limb('M286 136 Q300 146 302 160', '#c47a45')}
        <g stroke="${C.sumi}" stroke-width="1.5"><path d="M262 196 L256 124 Q272 112 288 124 L282 196Z" fill="#c47a45"/>
        <ellipse cx="272" cy="96" rx="18" ry="22" fill="#c47a45"/><path d="M254 90 Q272 66 290 90" stroke="#8a4a22" stroke-width="5" fill="none"/>
        <g fill="${C.sumi}"><ellipse cx="265" cy="94" rx="3.5" ry="5"/><ellipse cx="279" cy="94" rx="3.5" ry="5"/><ellipse cx="272" cy="108" rx="4.5" ry="3.5"/></g></g>
      </g>` },
  { k: '奈良', y: 'なら', from: '710年〜',
    h2: `${r('都', 'みやこ')}は${r('平城京', 'へいじょうきょう')}。${r('仏教', 'ぶっきょう')}がさかんになった。`,
    h3: `710${r('年', 'ねん')}・${r('聖武天皇', 'しょうむてんのう')}・${r('東大寺', 'とうだいじ')}`,
    svg: `${BG}
      <g filter="url(#wash)"><ellipse cx="130" cy="100" rx="74" ry="88" fill="${C.gold}" opacity=".7"/><rect y="186" width="320" height="14" fill="${C.kuri}" opacity=".6"/></g>
      <ellipse cx="130" cy="100" rx="74" ry="88" fill="none" stroke="${C.shu}" stroke-width="2" filter="url(#ink)"/>
      ${kasumi(210, 28, 120)}
      <g ${INK}>
        <path d="M68 186 Q74 112 130 106 Q186 112 192 186Z" fill="#4e463c"/>
        <ellipse cx="101" cy="82" rx="5" ry="15" fill="#5e5446"/><ellipse cx="159" cy="82" rx="5" ry="15" fill="#5e5446"/>
        <circle cx="130" cy="74" r="28" fill="#5e5446"/><ellipse cx="130" cy="48" rx="13" ry="9" fill="#5e5446"/>
        <path d="M104 64 A28 28 0 0 1 156 64" stroke="#2f2820" stroke-width="8" stroke-dasharray="3 3" fill="none"/>
        <path d="M116 76 q5 3 10 0 M134 76 q5 3 10 0 M124 90 q6 3 12 0" stroke="#1a140e" stroke-width="2" fill="none"/><circle cx="130" cy="66" r="2" fill="${C.gold}"/>
        <path d="M166 150 L170 114 Q177 104 184 114 L182 150Z" fill="#5e5446"/>
        <path d="M56 186 Q130 170 204 186 L204 200 L56 200Z" fill="${C.kuri}"/>
        ${limb('M247 160 v30 M257 162 v28 M273 162 v28 M283 160 v30', '#a86a3c', 5)}
        <ellipse cx="264" cy="150" rx="28" ry="14" fill="#a86a3c"/><path d="M282 146 L292 120 L301 122 L292 152Z" fill="#a86a3c"/>
        <ellipse cx="302" cy="118" rx="11" ry="6" fill="#a86a3c"/>
        <g fill="${C.gofun}" stroke="none"><circle cx="252" cy="146" r="2.5"/><circle cx="264" cy="142" r="2.5"/><circle cx="276" cy="147" r="2.5"/><circle cx="260" cy="153" r="2.5"/></g>
        <path d="M296 113 l-5 -14 l-7 3 M291 99 l2 -9 M303 112 l4 -15 l7 2" stroke="#5e3c22" stroke-width="2.5" fill="none"/>
      </g>` },
  { k: '平安', y: 'へいあん', from: '794年〜',
    h2: `${r('貴族', 'きぞく')}の${r('時代', 'じだい')}。ひらがな・カタカナが${r('生', 'う')}まれた。`,

const $ = id => document.getElementById(id);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const name = e => `${r(e.k, e.y)}${r('時代', 'じだい')}`;

let order, idx, hint, score, pts, step;

// đáp án nhiễu: ưu tiên các thời kỳ gần nhau để không đoán mò được
function options(e) {
  const i = ERAS.indexOf(e);
  const near = shuffle(ERAS.filter(x => x !== e)).sort((a, b) => Math.abs(ERAS.indexOf(a) - i) - Math.abs(ERAS.indexOf(b) - i));
  return shuffle([e, ...near.slice(0, 3)]);
}

function drawLine(el) {
  el.innerHTML = ERAS.map(e => {
    const p = pts.get(e), now = step !== 'end' && order[idx] === e;
    return `<span class="${p !== undefined ? 'p' + p : ''}${now ? ' now' : ''}">${p !== undefined ? e.k : '？'}</span>`;
  }).join('');
}

function reset() { order = shuffle(ERAS); idx = -1; score = 0; pts = new Map(); }

function next() {
  idx++;
  if (idx >= ERAS.length) return finish();
  const e = order[idx];
  hint = 1; step = 'ask';
  $('pic').innerHTML = `<svg viewBox="0 0 320 200" role="img" aria-label="ヒントの絵">${e.svg}${(e.tags || []).map(tag).join('')}</svg>`;
  $('hints').innerHTML = '';
  $('opts').innerHTML = options(e).map((o, n) => `<button data-i="${ERAS.indexOf(o)}"><small style="font-size:.6em">${n + 1}</small> ${name(o)}</button>`).join('');
  $('msg').innerHTML = ''; $('msg').className = 'msg';
  $('hintbtn').hidden = false; $('hintbtn').disabled = false; $('next').hidden = true;
  $('round').textContent = `${idx + 1}/${ERAS.length}`;
  drawLine($('line'));
}

function showHint() {
  if (step !== 'ask' || hint >= 3) return;
  hint++;
  const e = order[idx];
  $('hints').insertAdjacentHTML('beforeend', `<li><b>ヒント${hint - 1}</b>${hint === 2 ? e.h2 : e.h3}</li>`);
  $('hintbtn').disabled = hint >= 3;
}

function pick(btn) {
  if (step !== 'ask' || btn.disabled) return;
  const e = order[idx], ok = +btn.dataset.i === ERAS.indexOf(e);
  if (!ok) {
    btn.classList.add('ng'); btn.disabled = true;
    if (hint < 3) { showHint(); $('msg').textContent = 'ざんねん！ヒントを見てね。'; $('msg').className = 'msg ng'; return; }
  }
  // đúng: 3/2/1 điểm theo số hint đã mở; sai cả sau hint 3: 0 điểm
  const p = ok ? 4 - hint : 0;
  step = 'done'; score += p; pts.set(e, p);
  document.querySelectorAll('#opts button').forEach(b => { b.disabled = true; if (+b.dataset.i === ERAS.indexOf(e)) b.classList.add('ok'); });
  $('msg').innerHTML = `${ok ? `${r('正解', 'せいかい')}！ +${p}${r('点', 'てん')}` : `${r('答', 'こた')}えは ${name(e)}`}<br><small>${name(e)}：${e.from}</small>`;
  $('msg').className = 'msg ' + (ok ? 'ok' : 'ng');
  $('score').textContent = `${score}点`;
  $('hintbtn').hidden = true; $('next').hidden = false; $('next').focus();
  $('next').textContent = idx + 1 >= ERAS.length ? '結果を見る ▶' : '次へ ▶';
  drawLine($('line'));
}

function finish() {
  step = 'end';
  const max = ERAS.length * 3;
  const title = score >= 24 ? '歴史博士' : score >= 18 ? '歴史好き' : score >= 10 ? '歴史見習い' : 'がんばろう！';
  $('endTitle').innerHTML = title;
  $('stats').innerHTML = `${r('合計', 'ごうけい')} <b>${score} / ${max}${r('点', 'てん')}</b><br>${r('時代', 'じだい')}の${r('順番', 'じゅんばん')}も${r('覚', 'おぼ')}えたかな？`;
  drawLine($('endLine'));
  $('end').hidden = false; $('again').focus();
}

document.addEventListener('click', e => { const b = e.target.closest('#opts button'); if (b) pick(b); });
document.addEventListener('keydown', e => {
  if (!$('start').hidden || !$('end').hidden) return;
  if ('1234'.includes(e.key) && e.key) { const b = document.querySelectorAll('#opts button')[+e.key - 1]; if (b) pick(b); }
  if (e.key === 'h' || e.key === 'H') showHint();
});
$('hintbtn').onclick = showHint;
$('next').onclick = next;
$('go').onclick = () => { $('start').hidden = true; next(); };
$('again').onclick = () => { $('end').hidden = true; reset(); next(); };
$('kana').onchange = e => document.body.classList.toggle('nokana', !e.target.checked);

reset();
</script>
