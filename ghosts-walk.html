<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おばけ道中</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&family=Yuji+Mai&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0612; color: #fff; }
    body { font-family: 'Zen Maru Gothic', sans-serif; }
    .pop { font-family: 'Mochiy Pop One', sans-serif; }
    .brush { font-family: 'Yuji Mai', 'Mochiy Pop One', serif; }
    rt { font-size: .5em; }

    /* ---------- SKY & FOG (2D, đổi theo khu vực) ---------- */
    .layers { position: fixed; inset: 0; pointer-events: none; }
    .lay { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .lay.on { opacity: 1; }
    .moon { position: absolute; border-radius: 50%; }
    .cartouche { position: absolute; top: 64px; left: 3%; display: flex; gap: 10px; }
    .cartouche div { background: #e8dcc0; color: #1a1410; border: 3px solid #0c0a08; outline: 2px solid #a8322a; outline-offset: -8px;
      writing-mode: vertical-rl; font-family: 'Yuji Mai', serif; font-size: 1.6rem; padding: 14px 8px; }
    .cartouche div + div { font-size: 1.1rem; height: fit-content; }
    .tube { position: absolute; top: 8%; left: 30%; right: 30%; height: 16px; border-radius: 8px; background: #f8fff4;
      box-shadow: 0 0 60px 30px rgba(248, 255, 244, .25); animation: tube 5s infinite; }
    @keyframes tube { 0%, 100% { opacity: 1; } 8% { opacity: .2; } 10% { opacity: 1; } 12% { opacity: .3; } 14% { opacity: 1; } 70% { opacity: 1; } 71% { opacity: .1; } 74% { opacity: 1; } }

    /* ---------- 3D WORLD ---------- */
    #world { position: fixed; inset: 0; perspective: 600px; perspective-origin: 50% 50%; overflow: hidden; }
    #look, #bob { position: absolute; inset: 0; transform-style: preserve-3d; }
    #look { transition: transform .5s ease-out; }
    #scene { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
    .o { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
    .o svg { display: block; overflow: visible; }
    .walking #bob { animation: walkbob .55s ease-in-out infinite; }
    @keyframes walkbob { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 9px); } 50% { transform: translate(0, 0); } 75% { transform: translate(4px, 9px); } }
    .shake #world { animation: shake .4s; }
    @keyframes shake { 20% { transform: translate(-14px, 6px); } 40% { transform: translate(12px, -8px); } 60% { transform: translate(-8px, 4px); } 80% { transform: translate(6px, 0); } }

    .ghost { pointer-events: auto; cursor: pointer; opacity: .22; filter: blur(3px) brightness(.6);
      transition: transform 1.4s cubic-bezier(.2, .8, .3, 1), opacity 1.4s, filter 1.4s; }
    .ghost.awake { opacity: 1; filter: drop-shadow(0 0 30px rgba(0, 0, 0, .8)); }
    .ghost.angry svg { animation: jolt .5s ease; filter: drop-shadow(0 0 30px rgba(255, 0, 40, .9)); }
    .ghost.poke svg { animation: jolt .5s ease; }
    @keyframes jolt { 20% { transform: scale(1.15) translateY(-10px); } 40% { transform: scale(1.1) rotate(-4deg); } 60% { transform: scale(1.12) rotate(4deg); } }

    /* SVG scene animations */
    .twinkle { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: .2; } }
    .flame { animation: flame 2.2s ease-in-out infinite; }
    @keyframes flame { 0%, 100% { opacity: 1; } 40% { opacity: .75; } 45% { opacity: .95; } 70% { opacity: .6; } }
    .sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes sway { 50% { transform: skewX(4deg); } }
    .blink-a { animation: blinkL 1s steps(1) infinite; }
    .blink-b { animation: blinkL 1s steps(1) infinite .5s; }
    @keyframes blinkL { 50% { fill: #3a0a0a; } }

    /* character idle */
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes bob { 50% { transform: translateY(-14px); } }
    .body { animation: bob 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .c-yurei .body { animation: drift-g 5s ease-in-out infinite; }
    @keyframes drift-g { 25% { transform: translate(-6px, -14px) rotate(-3deg); } 75% { transform: translate(6px, -6px) rotate(3deg); } }
    .tail, .hairs { animation: tailw 2s ease-in-out infinite; transform-box: fill-box; transform-origin: top; }
    @keyframes tailw { 50% { transform: skewX(7deg); } }
    .breath circle { animation: breath 2.4s ease-out infinite; transform-box: fill-box; }
    .breath circle:nth-child(2) { animation-delay: .3s; }
    .breath circle:nth-child(3) { animation-delay: .6s; }
    @keyframes breath { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(50px, -10px) scale(1.8); } }
    /* テケテケ bò bằng hai tay: tay trái/phải thay nhau nhấc lên rồi đập xuống, thân nhún theo */
    .c-teke .body { animation: crawl .9s ease-in-out infinite; }
    @keyframes crawl { 0%, 50%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-10px) rotate(-4deg); } 75% { transform: translateY(-10px) rotate(4deg); } }
    .armL, .armR { transform-box: view-box; animation: armL .9s ease-in-out infinite; transform-origin: 70px 128px; }
    .armR { animation-name: armR; transform-origin: 130px 128px; }
    @keyframes armL { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(48deg); } }
    @keyframes armR { 0%, 50%, 100% { transform: rotate(0); } 75% { transform: rotate(-48deg); } }
    .mist { animation: mistd 5s ease-in-out infinite alternate; }
    @keyframes mistd { to { transform: translateX(12px); } }
    .drip { animation: drip 2s ease-in infinite; transform-box: fill-box; transform-origin: top; }
    .drip:nth-of-type(2n) { animation-delay: .7s; }
    @keyframes drip { 0% { transform: scaleY(.3); } 80% { transform: scaleY(1.2); } 100% { transform: scaleY(.3); } }
    .speed line { animation: speed .5s linear infinite; }
    .speed line:nth-child(2) { animation-delay: .15s; }
    .speed line:nth-child(3) { animation-delay: .3s; }
    @keyframes speed { 0% { opacity: 0; transform: translateX(20px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateX(-30px); } }
    .reach { animation: reach 2.6s ease-in-out infinite; transform-box: view-box; transform-origin: 132px 100px; }
    @keyframes reach { 50% { transform: rotate(-9deg); } }
    .jaw { animation: chatter .5s steps(2) infinite; }
    @keyframes chatter { 50% { transform: translateY(9px); } }
    .glow { animation: glowp 1.2s ease-in-out infinite alternate; }
    @keyframes glowp { from { opacity: .45; } }
    .mask { transition: transform .4s ease-in, opacity .4s; transform-box: fill-box; }
    .reveal .mask { transform: translate(30px, 80px) rotate(30deg); opacity: 0; }
    .cape { animation: cape 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes cape { 50% { transform: skewX(-5deg) scaleX(1.05); } }

    /* ---------- PARTICLES ---------- */
    #particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .pt { position: absolute; border-radius: 50%; }
    .pt.snow { top: -12px; background: #fff; animation: fall linear infinite; }
    .pt.orb { bottom: -30px; background: radial-gradient(circle, #d4f1ff, #5fb8ff 60%, transparent 70%); filter: blur(1px); animation: rise linear infinite; }
    .pt.firefly { background: #c8ff8a; box-shadow: 0 0 12px 4px rgba(170, 255, 120, .6); animation: drift ease-in-out infinite alternate; }
    .pt.petal { top: -12px; background: #ffc4d6; border-radius: 80% 0 80% 0; animation: fall linear infinite; }
    .pt.ash { top: -12px; background: rgba(200, 190, 180, .7); animation: fall linear infinite; }
    .pt.dust { bottom: -10px; background: rgba(255, 230, 200, .8); animation: rise linear infinite; }
    @keyframes fall { to { transform: translate(60px, 110vh) rotate(360deg); } }
    @keyframes rise { 0% { opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-40px, -110vh); opacity: 0; } }
    @keyframes drift { 0% { transform: translate(0, 0); opacity: .2; } 100% { transform: translate(40px, -60px); opacity: 1; } }

    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.go { animation: flash .9s; }
    @keyframes flash { 0% { opacity: .8; } 15% { opacity: 0; } 25% { opacity: .5; } 40%, 100% { opacity: 0; } }
    #redflash { position: fixed; inset: 0; background: radial-gradient(ellipse, transparent 30%, rgba(200, 0, 30, .7)); opacity: 0; pointer-events: none; }
    #redflash.go { animation: redf .7s; }
    @keyframes redf { 0% { opacity: 1; } 100% { opacity: 0; } }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0, 0, 0, .6)); }

    /* ---------- UI ---------- */
    .bubble { position: fixed; left: calc(50% - 90px); top: calc(50% - 250px); z-index: 6; transform: translate(-50%, -100%) scale(0); transform-origin: bottom center;
      background: #f4efe6; color: #2a0d14; padding: 12px 20px; border-radius: 18px; text-align: center; white-space: nowrap;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .35); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
    .bubble::after { content: ""; position: absolute; bottom: -12px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top-color: #f4efe6; border-bottom: 0; }
    .bubble.show { transform: translate(-50%, -100%) scale(1); }
    .bubble b { display: block; font-size: 1.4rem; color: #8a0e22; }

    .card { position: fixed; right: 3vw; top: 50%; z-index: 5; width: min(42vw, 520px); max-height: 86vh; overflow-y: auto;
      background: rgba(12, 6, 18, .82); backdrop-filter: blur(6px); border: 2px solid rgba(255, 255, 255, .2); border-radius: 22px;
      padding: 24px 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); transform: translate(120%, -50%); transition: transform .6s cubic-bezier(.2, .9, .3, 1.1); }
    .card.show { transform: translate(0, -50%); }
    .card .no { display: inline-block; font-size: .9rem; padding: 4px 14px; border-radius: 999px; background: var(--accent); color: #12060c; font-weight: 700; }
    .card h2 { font-size: clamp(2rem, 4vw, 3.2rem); margin: 8px 0 2px; color: var(--accent); text-shadow: 0 0 16px var(--accent), 0 4px 0 rgba(0, 0, 0, .5); font-weight: 400; }
    .card .read { color: #d6cce6; font-size: .95rem; margin-bottom: 10px; }
    .card p { font-weight: 500; font-size: clamp(1rem, 1.5vw, 1.2rem); line-height: 1.85; }
    .scare { margin-top: 10px; font-size: .9rem; color: #d6cce6; }
    .scare .off { opacity: .2; }
    .tip { margin-top: 6px; font-size: .85rem; color: #b8a8d0; }
    .quiz { margin-top: 16px; padding-top: 14px; border-top: 2px dashed rgba(255, 255, 255, .2); }
    .quiz .q { font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; }
    .opts { display: grid; gap: 8px; }
    .opts button { font: inherit; font-size: 1.05rem; text-align: left; padding: 10px 14px; border-radius: 12px; cursor: pointer; color: #fff;
      background: rgba(255, 255, 255, .08); border: 2px solid rgba(255, 255, 255, .25); transition: background .2s, transform .15s; }
    .opts button:hover:not(:disabled), .opts button:focus-visible { background: rgba(255, 255, 255, .18); transform: translateX(4px); }
    .opts button kbd { font-family: inherit; display: inline-block; width: 1.6em; text-align: center; margin-right: 8px; border-radius: 6px; background: rgba(255, 255, 255, .2); }
    .opts button.ok { background: #1f7a4a; border-color: #6dffb0; }
    .opts button.ng { background: #7a1a26; border-color: #ff6d7d; animation: shake .4s; opacity: .6; }
    .fb { min-height: 1.6em; margin-top: 10px; font-weight: 700; }
    .fb.ok { color: #6dffb0; } .fb.ng { color: #ff8a9a; }

    .hud { position: fixed; z-index: 4; text-shadow: 0 2px 6px #000; }
    #ofuda { top: 16px; left: 16px; display: flex; align-items: center; gap: 6px; font-size: 1rem; }
    #ofuda i { width: 16px; height: 30px; border-radius: 2px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .3); }
    #ofuda i.got { background: linear-gradient(#f4ecd6 0 20%, #c8283d 20% 26%, #f4ecd6 26%); border-color: #fff; box-shadow: 0 0 10px rgba(255, 220, 150, .7); }
    #prog { top: 16px; right: 20px; font-size: 1.1rem; }
    #hint { bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 1.15rem; background: rgba(0, 0, 0, .45); padding: 8px 20px; border-radius: 999px; white-space: nowrap; }
    #hint:empty { display: none; }
    #hint.pulse { animation: pulse 1.4s ease-in-out infinite; }
    #goBtn { bottom: 16px; right: 16px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: rgba(179, 18, 58, .7);
      color: #fff; font-size: 1.8rem; cursor: pointer; display: none; }
    #goBtn.on { display: block; }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }

    .overlay { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 16px; padding: 24px 16px; background: rgba(0, 0, 0, .35); }
    .overlay.on { display: flex; }
    #title h1 { font-size: clamp(2.4rem, 7.5vw, 5.4rem); line-height: 1.45; text-shadow: 0 0 18px rgba(255, 60, 80, .7), 0 6px 0 #3a0a14; animation: shiver 4s infinite; }
    #title h1 rt { font-size: .3em; letter-spacing: .15em; }
    @keyframes shiver { 0%, 90%, 100% { transform: none; } 92% { transform: translate(-3px, 1px) skewX(-3deg); } 94% { transform: translate(3px, -1px) skewX(3deg); } 96% { transform: none; } }
    .overlay p { font-size: clamp(1.05rem, 2.4vw, 1.4rem); text-shadow: 0 2px 8px #000; }
    .press { margin-top: 10px; font-size: clamp(1rem, 2.4vw, 1.3rem); padding: 14px 28px; border-radius: 999px; border: 3px solid #fff;
      background: #b3123a; color: #fff; cursor: pointer; box-shadow: 0 6px 0 #5e0820, 0 0 24px rgba(255, 40, 80, .5); animation: pbtn 1.4s ease-in-out infinite; }
    .press kbd { font-family: inherit; background: #fff; color: #b3123a; padding: 2px 10px; border-radius: 8px; margin-right: 6px; }
    @keyframes pbtn { 50% { transform: scale(1.06); } }
    #end { background: rgba(255, 240, 220, .25); }
    #end h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); text-shadow: 0 4px 0 #a2405a, 0 0 20px rgba(255, 255, 255, .6); }
    #end p { color: #3a1a2a; background: rgba(255, 255, 255, .75); padding: 6px 18px; border-radius: 12px; text-shadow: none; }
    .roster { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; max-width: 760px; width: 100%; }
    .roster div { background: rgba(20, 8, 20, .75); border: 2px solid rgba(255, 255, 255, .3); border-radius: 16px; padding: 8px 4px; font-size: .85rem; }
    .roster div.got { border-color: #ffd65a; box-shadow: 0 0 14px rgba(255, 214, 90, .5); }
    .roster svg { width: 100%; height: 90px; display: block; }

    @media (max-width: 760px) {
      .card { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 55vh; border-radius: 22px 22px 0 0; transform: translateY(110%); }
      .card.show { transform: translateY(0); }
      .bubble { top: 12vh; left: 50%; white-space: normal; width: 230px; }
      #hint { bottom: auto; top: 56px; font-size: .95rem; }
      .roster { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="glowY"><stop offset="0" stop-color="#ffd27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8" stop-opacity=".7"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeeaf6"/><stop offset=".6" stop-color="#d9d4ea" stop-opacity=".85"/><stop offset="1" stop-color="#d9d4ea" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeK" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#eceee9"/><stop offset="1" stop-color="#eceee9" stop-opacity="0"/></linearGradient>
    <pattern id="sudare" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#120f0c"/><circle cx="8" cy="8" r="2.6" fill="#d8ccb0"/></pattern>
    <filter id="glowF" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs></svg>

  <div class="layers" id="sky"></div>
  <div id="world"><div id="look"><div id="bob"><div id="scene"></div></div></div></div>
  <div class="layers" id="fog"></div>
  <div id="particles"></div>
  <div class="vignette"></div>
  <div id="flash"></div>
  <div id="redflash"></div>

  <div class="bubble" id="bubble"></div>
  <div class="card" id="card"></div>
  <div class="hud" id="ofuda"></div>
  <div class="hud" id="prog"></div>
  <div class="hud" id="hint"></div>
  <button class="hud" id="goBtn" aria-label="進む">→</button>

  <section class="overlay on" id="title">
    <h1 class="brush">おばけ<ruby>道中<rt>どうちゅう</rt></ruby></h1>
    <p><ruby>日本<rt>にほん</rt></ruby>のおばけの<ruby>世界<rt>せかい</rt></ruby>を<ruby>探検<rt>たんけん</rt></ruby>してみる？</p>
    <p style="font-size:1rem">おばけのクイズに<ruby>答<rt>こた</rt></ruby>えて、お<ruby>札<rt>ふだ</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>めよう。</p>
    <button class="press pop" id="startBtn"><kbd>Enter</kbd>でスタート</button>
  </section>

  <section class="overlay" id="end">
    <h1 class="brush">おつかれさま！</h1>
    <p id="score"></p>
    <div class="roster" id="roster"></div>
    <button class="press pop" id="againBtn"><kbd>Enter</kbd>でもう<ruby>一度<rt>いちど</rt></ruby></button>
  </section>

  <script>
    /* ================= DRAWING HELPERS (vẽ quanh gốc 0,0 = chân vật) ================= */
    let seed = 1;
    const rr = (a, b) => a + ((seed = seed * 16807 % 2147483647) / 2147483647) * (b - a); // seeded: thế giới giống nhau mỗi lần
    const rep = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');
    const at = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;

    const swirl = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#2f5d5a" stroke="#0c0a08" stroke-width="2"/><path d="M${x - r * .5} ${y} a${r * .5} ${r * .5} 0 1 1 ${r * .5} ${r * .5} a${r * .25} ${r * .25} 0 1 1 -${r * .25} -${r * .25}" stroke="#0c0a08" stroke-width="2.5" fill="none"/>`;
    const bush = (c1, c2) => `<circle cx="-40" cy="-20" r="34" fill="${c1}"/><circle cx="0" cy="-36" r="42" fill="${c1}"/><circle cx="44" cy="-18" r="32" fill="${c1}"/><circle cx="-10" cy="-48" r="22" fill="${c2}"/><circle cx="30" cy="-34" r="16" fill="${c2}"/><rect x="-74" y="-20" width="150" height="20" fill="${c1}"/>`;
    const tree = (t, l1, l2) => `
      <path d="M-18 0 Q-8 -70 -10 -120 L-40 -176 L-30 -182 L-4 -140 Q-2 -172 2 -212 L12 -212 Q12 -162 8 -134 L38 -174 L46 -166 L12 -110 Q8 -60 20 0Z" fill="${t}"/>
      <circle cx="-50" cy="-200" r="58" fill="${l1}"/><circle cx="40" cy="-215" r="62" fill="${l1}"/><circle cx="-5" cy="-262" r="64" fill="${l1}"/>
      <circle cx="-88" cy="-165" r="40" fill="${l1}"/><circle cx="80" cy="-170" r="44" fill="${l1}"/>
      <circle cx="-22" cy="-280" r="36" fill="${l2}"/><circle cx="-66" cy="-218" r="28" fill="${l2}"/><circle cx="26" cy="-236" r="32" fill="${l2}"/>`;
    const willow = (t, l) => `<path d="M-20 0 Q-10 -80 -22 -160 Q0 -205 34 -232 L44 -222 Q14 -190 12 -160 Q16 -80 24 0Z" fill="${t}"/>
      <ellipse cx="0" cy="-232" rx="150" ry="48" fill="${l}"/>
      <g class="sway" stroke="${l}" stroke-width="7" fill="none" stroke-linecap="round">${rep(20, i => { const x0 = -145 + i * 15; return `<path d="M${x0} -228 Q${x0 + rr(-10, 10)} -130 ${x0 + rr(-20, 20)} ${rr(-90, -10)}"/>`; })}</g>`;
    const pine = c => `<rect x="-9" y="-34" width="18" height="34" fill="#3a2a22"/>` +
      rep(3, k => { const w = 92 - k * 24, b = -30 - k * 52; return `<path d="M${-w} ${b} L0 ${b - 112} L${w} ${b}Z" fill="${c}"/>` +

    ];

    // 8 khu vực dọc con đường: start, 6 con ma, end
    const ZONES = [
      { key: 'start', fx: 'firefly', sky: 'linear-gradient(#060b1c,#1b2f45 50%,#14201b 50%)', fog: '#2c3f4a', stars: 1,
        moon: [90, '12%', '14%', '#fdf3c8'], ground: 'linear-gradient(90deg,#14201b 0 42%,#3b443b 42% 58%,#14201b 58%)' },
      { key: 'yurei', fx: 'orb', sky: 'linear-gradient(#0c0720,#34205a 50%,#140e24 50%)', fog: '#4a2e6a', stars: 1,
        moon: [140, '8%', '12%', '#fff6d5'], ground: 'linear-gradient(90deg,#140e24 0 40%,#2e2638 40% 60%,#140e24 60%)' },
      { key: 'yuki', fx: 'snow', sky: 'linear-gradient(#06122a,#2a5482 40%,#8db6dd 50%,#dfeefc 50%)', fog: '#cfe3f5', stars: 1,
        moon: [70, '10%', '72%', '#eef6ff'], ground: 'linear-gradient(90deg,#dfeefc 0 42%,#f4f9ff 42% 58%,#dfeefc 58%)' },
      { key: 'teke', fx: 'dust', sky: 'linear-gradient(#1e0d33,#8e2f63 25%,#e5604f 40%,#ffb05a 50%,#2a1a24 50%)', fog: '#ff9a6a',
        moon: [170, '38%', '22%', '#ffd27a'],
        ground: 'linear-gradient(90deg,transparent 46%,#b9bccb 46% 46.6%,transparent 46.6% 53.4%,#b9bccb 53.4% 54%,transparent 54%), repeating-linear-gradient(0deg,#3a2418 0 26px,transparent 26px 70px) center/440px 100% no-repeat, linear-gradient(90deg,#2a1a24 0 44%,#4a3a3a 44% 56%,#2a1a24 56%)' },
      { key: 'gasha', fx: 'ash', sky: 'linear-gradient(#15120f,#221c17 50%,#3e3832 50%)', fog: '#2a221c', cartouche: 1,
        ground: 'repeating-linear-gradient(60deg,#14100c 0 5px,#3e3832 5px 46px,#6e655c 46px 48px,#3e3832 48px 70px)',
        wall: [420, 'linear-gradient(transparent 55%,#2a1e14 55%), radial-gradient(circle,#d8ccb0 2.4px,transparent 3px) 0 0/16px 16px, #120f0c'] },
      { key: 'kuchi', fx: 'petal', sky: 'linear-gradient(#2a1640,#a8406e 25%,#f08a5a 42%,#ffc07a 50%,#3a2e38 50%)', fog: '#f0a070',
        ground: 'linear-gradient(90deg,transparent 49.7%,#ddd 49.7% 50.3%,transparent 50.3%), linear-gradient(90deg,#3a2e38 0 40%,#2d2233 40% 60%,#3a2e38 60%)',
        wall: [110, 'repeating-linear-gradient(90deg,#574858 0 2px,transparent 2px 80px), repeating-linear-gradient(0deg,#574858 0 2px,transparent 2px 36px), #6b5a6e'] },
      { key: 'aka', fx: 'dust', sky: 'linear-gradient(#1e2826,#3a4844 50%,#3d4a46 50%)', fog: '#3d4a46', tube: 1,
        ground: 'repeating-conic-gradient(#73827d 0 25%,#5d6b67 0 50%) 0 0/90px 90px',
        wall: [520, 'repeating-linear-gradient(90deg,#5b4a4a 0 12px,#c0a48a 12px 212px,#5b4a4a 212px 224px,transparent 224px 300px) 0 100%/100% 82% no-repeat, linear-gradient(#6f968a 3px,transparent 3px) 0 0/60px 60px, linear-gradient(90deg,#6f968a 3px,transparent 3px) 0 0/60px 60px, #9cc2b6'] },
      { key: 'end', fx: 'petal', sky: 'linear-gradient(#7fa8e0,#ffc6b0 35%,#ffe6b8 50%,#7fb85a 50%)', fog: '#fff0d0', fuji: 1,
        moon: [150, '34%', '44%', '#fff1c1'], ground: 'linear-gradient(90deg,#7fb85a 0 42%,#d9c69a 42% 58%,#7fb85a 58%)' }
    ];

    /* ================= WORLD BUILD ================= */
    const L = 1600, GY = 230;   // chiều dài 1 khu, độ cao mắt
    const stopAt = i => (i + 1) * L - 450;      // vị trí camera khi đứng trước con ma i
    const zoneNear = k => -(k - 1) * L - 900;    // ranh giới khu nằm xa sau lưng con ma    // z gần của khu k (k = 0..7)
    const $ = id => document.getElementById(id);
    let objs = [], html = [];

    const add = (h, z, zFar) => { html.push(h); objs.push({ z, zFar }); };
    function bb(vb, inner, x, z, sc, cls = '') {
      const [vx, vy, vw, vh] = vb;
      const gz = -Math.round(-z / L) * L; // chừa trống khoảng giữa camera và con ma gần nhất
      if (gz < 0 && z > gz - 60 && z < gz + 520 && x + vx * sc < 260 && x + (vx + vw) * sc > -560) return;
      add(`<div class="o ${cls}" style="width:${vw * sc}px;height:${vh * sc}px;transform:translate3d(${x + vx * sc}px,${GY + vy * sc}px,${z}px)"><svg viewBox="${vx} ${vy} ${vw} ${vh}" width="100%" height="100%">${inner}</svg></div>`, z);
    }
    const VB = { tree: [-135, -330, 270, 332], pine: [-95, -250, 190, 252], grave: [-46, -140, 92, 142], sotoba: [-25, -190, 50, 192],
      toro: [-72, -142, 144, 144], willow: [-170, -285, 340, 287], torii: [-172, -285, 344, 287], crossing: [-65, -315, 130, 317],
      vending: [-4, -194, 98, 196], lamp: [-115, -295, 250, 297], pole: [-46, -522, 92, 524], bush: [-80, -90, 160, 92],
      gate: [-132, -382, 264, 384], straw: [-75, -322, 160, 324], grass: [-32, -60, 64, 62] };
    const side = () => (rr(0, 1) < .5 ? -1 : 1);
    const along = (k, n, f) => { for (let i = 0; i < n; i++) f(zoneNear(k) - (i + rr(.2, .8)) * L / n, i); };

    function build() {
      seed = 7; objs = []; html = [];
      ZONES.forEach((Z, k) => {
        const zN = zoneNear(k) + (k === 0 ? 1300 : 0), len = (k === 0 ? 1300 : 0) + (k === 7 ? 2 * L : L);
        add(`<div class="o" style="width:2400px;height:${len}px;background:${Z.ground};transform:translate3d(-1200px,${GY}px,${zN - len}px) rotateX(90deg)"></div>`, zN, zN - len);
        if (Z.wall) [-1, 1].forEach(sd => add(`<div class="o" style="width:${len}px;height:${Z.wall[0]}px;background:${Z.wall[1]};transform:translate3d(${sd * (k === 5 ? 400 : 380)}px,${GY - Z.wall[0]}px,${zN}px) rotateY(90deg)"></div>`, zN, zN - len));
      });
      // start: rừng + cổng torii
      for (let z = 1200; z > -300; z -= 160) [-1, 1].forEach(sd => bb(VB.tree, tree('#251c26', '#173431', '#1f453f'), sd * rr(420, 900), z - rr(0, 80), rr(1.6, 2.2)));
      bb(VB.torii, torii('#b3343c'), 0, -150, 2.1);
      bb(VB.toro, toro(), -300, -60, 1.3); bb(VB.toro, toro(), 300, -60, 1.3);
      // 1 yurei: nghĩa địa
      along(1, 14, z => { bb(VB.grave, grave(), side() * rr(330, 800), z, rr(1.3, 1.7)); bb(VB.sotoba, sotoba(rr(-8, 8)), side() * rr(360, 900), z - 40, rr(1.4, 1.8)); });
      along(1, 4, z => { bb(VB.toro, toro(), -300, z, 1.3); bb(VB.toro, toro(), 300, z, 1.3); });
      along(1, 6, z => bb(VB.tree, tree('#1c1233', '#1c1233', '#22173e'), side() * rr(1000, 1500), z, 2.4));
      bb(VB.willow, willow('#1d1428', '#2a4434'), 520, -L + 150, 2.2);
      // 2 yuki: rừng thông tuyết
      along(2, 12, z => [-1, 1].forEach(sd => bb(VB.pine, pine(rr(0, 1) < .5 ? '#1f4a55' : '#163a44'), sd * rr(380, 1100), z - rr(0, 60), rr(1.8, 2.6))));
      along(2, 6, z => bb(VB.bush, bush('#ffffff', '#e6f1ff'), side() * rr(300, 600), z, 1.4));
      bb([-118, -170, 236, 172], house(200, 110, '#5a3b2a', '#f2f7ff', '#ffc65a'), 800, -2 * L + 400, 1.8);
      // 3 teke: đường ray, cột điện, nhà cao tầng
      along(3, 4, z => { bb(VB.pole, pole(), -420, z, 1); bb(VB.pole, pole(), 420, z - 200, 1); });
      along(3, 10, z => { const w = rr(140, 260), h = rr(260, 600); bb([-w / 2, -h, w, h], building(w, h), side() * rr(900, 1500), z, 1.3); });
      along(3, 10, z => bb(VB.grass, grass('#170a18'), side() * rr(260, 500), z, 1.5));
      bb(VB.crossing, crossing(), 330, -3 * L + 350, 1.4);
      // 4 gasha: cung điện cổ ukiyo-e
      along(4, 4, z => bb(VB.gate, gate(), 0, z, 2.1));
      along(4, 8, z => bb(VB.straw, straw(), side() * rr(260, 360), z, rr(1.2, 1.6)));
      // 5 kuchi: phố Showa chiều tà
      along(5, 8, z => [-1, 1].forEach(sd => { const w = rr(180, 260), h = rr(120, 160); bb([-w / 2 - 18, -h * 1.5 - 2, w + 36, h * 1.5 + 4], house(w, h, '#3a1d3f', '#2a1430', '#ffd98a'), sd * rr(560, 900), z - rr(0, 60), 1.6); }));
      along(5, 3, z => { bb(VB.pole, pole(), -450, z, 1.1); bb(VB.pole, pole(), 450, z - 260, 1.1); });
      bb(VB.vending, vending(), -360, -5 * L + 500, 1.3); bb(VB.lamp, lamp(), 300, -5 * L + 250, 1.5);
      // 7 end: bình minh, hoa anh đào
      along(7, 12, z => [-1, 1].forEach(sd => bb(VB.tree, tree('#6b4a3a', '#ff9fb8', '#ffc4d4'), sd * rr(400, 1000), z - rr(0, 80), rr(1.6, 2.2))));
      bb(VB.torii, torii('#d8473f'), 0, -6 * L - 1700, 2.1);
      // ma
      GHOSTS.forEach((g, i) => {
        const vb = SVG[g.id].match(/viewBox="([^"]+)"/)[1].split(' ').map(Number), w = { gasha: 680, yurei: 440 }[g.id] || 500, h = w * vb[3] / vb[2];
        add(`<div class="o ghost c-${g.id}" data-i="${i}" style="width:${w}px;height:${h}px;transform:${ghostPos(i, h, w, 600)}">${SVG[g.id]}</div>`, -(i + 1) * L);
      });
      const scene = $('scene');
      scene.innerHTML = html.join('');
      [...scene.children].forEach((el, i) => objs[i].el = el);
      $('sky').innerHTML = ZONES.map(Z => `<div class="lay" data-k="${Z.key}" style="background:${starBg(Z.stars)}${Z.sky}">` +
        (Z.moon ? `<div class="moon" style="width:${Z.moon[0]}px;height:${Z.moon[0]}px;top:${Z.moon[1]};right:${Z.moon[2]};background:${Z.moon[3]};box-shadow:0 0 80px 30px ${Z.moon[3]}55"></div>` : '') +
        (Z.cartouche ? `<div class="cartouche"><div>相馬の古内裏</div><div>骸骨</div></div>` : '') + (Z.tube ? '<div class="tube"></div>' : '') +
        (Z.fuji ? `<svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax meet" style="position:absolute;left:0;right:0;bottom:50%;width:100%;height:30%"><path d="M0 300 L400 40 Q500 10 600 40 L1000 300Z" fill="#6b84b8"/><path d="M400 40 Q500 10 600 40 L660 90 L610 80 L570 110 L530 76 L490 106 L450 78 L410 104 L340 90Z" fill="#fff"/></svg>` : '') + '</div>').join('');
      $('fog').innerHTML = ZONES.map(Z => `<div class="lay" data-k="${Z.key}" style="background:linear-gradient(transparent 42%,${Z.fog}cc 49.5%,${Z.fog}88 51.5%,transparent 58%)"></div>`).join('');
    }
    // ma đứng hơi lệch trái để chừa chỗ cho thẻ thông tin; back = lùi thêm khi còn "ngủ"
    const ghostPos = (i, h, w, back) => `translate3d(${-150 - w / 2}px,${GY - h}px,${-(i + 1) * L - back}px)`;
    function starBg(on) {
      if (!on) return '';
      seed = 99;
      return rep(50, () => `radial-gradient(1.5px 1.5px at ${rr(0, 100).toFixed(1)}% ${rr(0, 45).toFixed(1)}%,#fff,transparent),`);
    }

    /* ================= CAMERA ================= */
    let cam = 0, zone = -1;
    function setCam(s) {
      cam = s;
      $('scene').style.transform = `translateZ(${s}px)`;
      for (const o of objs) {
        const d = -o.z - s, show = o.zFar !== undefined ? (-o.zFar - s > 0 && d < 3400) : (d > 30 && d < 3400);
        o.el.style.display = show ? '' : 'none';
        if (show && !o.el.classList.contains('ghost')) o.el.style.opacity = d > 900 ? Math.max(0, 1 - (d - 900) / 1100) : 1;
      }
      const k = Math.max(0, Math.min(7, Math.floor((s - 900) / L) + 1));
      if (k !== zone) {
        zone = k;
        document.querySelectorAll('.lay').forEach(l => l.classList.toggle('on', l.dataset.k === ZONES[k].key));
        particles(ZONES[k].fx);
      }
    }
    function particles(type, n = 36) {
      const box = $('particles');
      box.innerHTML = '';
      for (let i = 0; type && i < n; i++) {
        const s = document.createElement('span'), size = 3 + Math.random() * (type === 'orb' ? 16 : 7);
        s.className = 'pt ' + type;
        s.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${4 + Math.random() * 8}s;animation-delay:${-Math.random() * 10}s;` +
          (type === 'firefly' ? `top:${20 + Math.random() * 70}%;` : '');
        box.appendChild(s);
      }
    }
    function walk(to, done) {
      const from = cam, t0 = performance.now(), dur = 3000;
      document.body.classList.add('walking');
      (function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        setCam(from + (to - from) * (.5 - Math.cos(Math.PI * p) / 2));
        if (p < 1) requestAnimationFrame(step);
        else { document.body.classList.remove('walking'); done(); }
      })(t0);
    }

    /* ================= GAME FLOW ================= */
    // state: title → walking → quiz → cleared → walking → … → end
    let state = 'title', cur = -1, firstTry = true, got = [];
    const ghostEl = i => document.querySelector(`.ghost[data-i="${i}"]`);

    function hint(text, pulse) { $('hint').innerHTML = text; $('hint').classList.toggle('pulse', !!pulse); $('goBtn').classList.toggle('on', !!pulse); }
    function hud() {
      $('ofuda').innerHTML = 'お<ruby>札<rt>ふだ</rt></ruby>' + GHOSTS.map((_, i) => `<i class="${got[i] ? 'got' : ''}"></i>`).join('');
      $('prog').textContent = cur < 0 ? '' : `${Math.min(cur + 1, 6)} / 6`;
    }

    function start() {
      document.activeElement.blur();
      $('title').classList.remove('on'); $('end').classList.remove('on');
      next();
    }
    function next() {
      $('card').classList.remove('show'); $('bubble').classList.remove('show');
      if (window.speechSynthesis) speechSynthesis.cancel();
      state = 'walking'; hint('…');
      if (cur === GHOSTS.length - 1) return walk(6 * L + 1000, finish);
      cur++; hud();
      walk(stopAt(cur), () => arrive(cur));
    }
    function arrive(i) {
      const el = ghostEl(i), g = GHOSTS[i];
      $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
      el.classList.add('awake');
      el.style.transform = ghostPos(i, el.offsetHeight, el.offsetWidth, 0);
      state = 'quiz'; firstTry = true;
      const opts = g.opts.map((t, j) => ({ t, ok: j === 0 })).sort(() => Math.random() - .5);
      const card = $('card');
      card.style.setProperty('--accent', g.accent);
      card.innerHTML = `
        <span class="no">${i + 1}<ruby>体目<rt>たいめ</rt></ruby> / 6</span>
        <h2 class="brush">${g.name}</h2>
        <div class="read">${g.read}　【${g.type}】</div>
        <p>${g.desc}</p>
        <div class="scare"><ruby>怖<rt>こわ</rt></ruby>さ：${'👻'.repeat(g.scare)}<span class="off">${'👻'.repeat(5 - g.scare)}</span></div>
        <div class="tip">💡 おばけをクリックすると<ruby>話<rt>はな</rt></ruby>すよ…</div>
        <div class="quiz"><div class="q">❓ ${g.q}</div>
          <div class="opts">${opts.map((o, j) => `<button data-ok="${o.ok}"><kbd>${j + 1}</kbd>${o.t}</button>`).join('')}</div>
          <div class="fb" id="fb"></div></div>`;
      setTimeout(() => card.classList.add('show'), 700);
      hint('クイズに<ruby>答<rt>こた</rt></ruby>えよう！ (1・2・3)');
    }
    function answer(btn) {
      if (state !== 'quiz' || btn.disabled) return;
      btn.blur();
      const i = cur, fb = $('fb');
      if (btn.dataset.ok === 'true') {
        btn.classList.add('ok');
        document.querySelectorAll('.opts button').forEach(b => b.disabled = true);
        if (firstTry) got[i] = true;
        fb.className = 'fb ok';
        fb.innerHTML = firstTry ? '<ruby>正解<rt>せいかい</rt></ruby>！お<ruby>札<rt>ふだ</rt></ruby>をゲット！' : '<ruby>正解<rt>せいかい</rt></ruby>！…でもお<ruby>札<rt>ふだ</rt></ruby>はもらえない';
        state = 'cleared'; hud();
        hint(i === GHOSTS.length - 1 ? '→ で<ruby>外<rt>そと</rt></ruby>へ<ruby>出<rt>で</rt></ruby>よう' : '→ で<ruby>先<rt>さき</rt></ruby>へ<ruby>進<rt>すす</rt></ruby>む', true);
      } else {
        firstTry = false;
        btn.classList.add('ng'); btn.disabled = true;
        fb.className = 'fb ng'; fb.textContent = 'ちがう…もう一度（いちど）！';
        const el = ghostEl(i);
        el.classList.remove('angry'); void el.offsetWidth; el.classList.add('angry');
        document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
        $('redflash').classList.remove('go'); void $('redflash').offsetWidth; $('redflash').classList.add('go');
      }
    }
    function finish() {
      state = 'end'; hint(''); $('prog').textContent = '';
      const n = got.filter(Boolean).length;
      $('score').innerHTML = `お<ruby>札<rt>ふだ</rt></ruby>：${n} / 6　` + (n === 6 ? 'おばけ<ruby>博士<rt>はかせ</rt></ruby>だ！' : n >= 4 ? 'なかなかの<ruby>勇者<rt>ゆうしゃ</rt></ruby>！' : 'もう<ruby>一度<rt>いちど</rt></ruby><ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！');
      $('roster').innerHTML = GHOSTS.map((g, i) => `<div class="${got[i] ? 'got' : ''}">${SVG[g.id]}${g.name}${got[i] ? ' ✓' : ''}</div>`).join('');
      $('end').classList.add('on');
    }
    function reset() {
      document.activeElement.blur();
      cur = -1; got = []; state = 'title'; zone = -1;
      build(); setCam(-1000); hud(); hint('');
      $('end').classList.remove('on'); $('title').classList.add('on');
    }

    function poke(el) {
      if (!el.classList.contains('awake')) return;
      const g = GHOSTS[+el.dataset.i];
      el.classList.remove('poke'); void el.offsetWidth; el.classList.add('poke', 'reveal');
      const r = el.getBoundingClientRect(), bub = $('bubble'); // bóng thoại bám theo đầu con ma trên màn hình
      if (innerWidth > 760) { // đầu sát mép trên thì đặt bóng thoại sang bên trái đầu
        const high = r.top < 150;
        bub.style.left = (high ? r.left - 60 : r.left + r.width / 2) + 'px'; bub.style.top = (high ? r.top + 150 : r.top + 20) + 'px';
      }
      bub.innerHTML = `<b class="brush">${g.line}</b><small>${g.sub}</small>`;
      bub.classList.add('show');
      speak(g);
    }
    // giọng đọc tiếng Nhật của trình duyệt; pitch/rate riêng cho từng con
    const VOICE = { yurei: [.4, .6], yuki: [1.3, .7], teke: [1.6, 1.4], gasha: [.1, .5], kuchi: [1, .8], aka: [.3, .75] };
    let audio;
    function speak(g) {
      try { // tiếng ù rùng rợn: 2 sóng sine lệch nhau, tắt dần
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const t = audio.currentTime, gain = audio.createGain();
        gain.connect(audio.destination);
        gain.gain.setValueAtTime(.18, t); gain.gain.exponentialRampToValueAtTime(.001, t + 1.6);
        [110, 116.5].forEach(f => { const o = audio.createOscillator(); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f / 2, t + 1.6); o.connect(gain); o.start(t); o.stop(t + 1.6); });
      } catch (e) {}
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const ja = speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
      [g.line, g.sub].forEach(text => {
        const u = new SpeechSynthesisUtterance(text.replace(/（.*?）/g, '')); // bỏ furigana trước khi đọc
        u.lang = 'ja-JP'; if (ja) u.voice = ja;
        [u.pitch, u.rate] = VOICE[g.id];
        speechSynthesis.speak(u);
      });
    }

    /* ================= INPUT ================= */
    function forward() {
      if (state === 'title') start();
      else if (state === 'cleared') next();
      else if (state === 'end') reset();
    }
    document.addEventListener('keydown', e => {
      if (state === 'quiz' && '123'.includes(e.key)) { const b = document.querySelectorAll('.opts button')[+e.key - 1]; if (b) answer(b); return; }
      if (e.key === 'Enter' && document.activeElement.tagName === 'BUTTON') return; // để nút tự xử lý
      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); forward(); }
    });
    document.addEventListener('click', e => {
      const opt = e.target.closest('.opts button'), gh = e.target.closest('.ghost');
      if (opt) answer(opt); else if (gh) poke(gh);
    });
    document.addEventListener('mousemove', e => { // nhìn quanh nhẹ theo chuột
      const dx = e.clientX / innerWidth - .5, dy = e.clientY / innerHeight - .5;
      $('look').style.transform = `rotateY(${dx * 6}deg) rotateX(${-dy * 3}deg)`;
    });
    $('startBtn').onclick = start;
    $('againBtn').onclick = reset;
    $('goBtn').onclick = forward;

    reset();
  </script>
</body>
</html>
